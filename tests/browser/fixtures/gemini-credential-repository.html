<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Gemini credential repository test</title>
  </head>
  <body data-status="running">
    <pre id="result"></pre>
    <script type="module">
      import { createGeminiCredentialRepository } from "/src/persistence/geminiCredentialRepository.ts";

      const DATABASE_NAME = "gemini-credential-browser-test";
      const PHASE_KEY = "gemini-credential-browser-test-phase";
      const SYNTHETIC_CREDENTIAL = "synthetic-gemini-key-not-real-v1";
      const result = document.querySelector("#result");

      function requestResult(request) {
        return new Promise((resolve, reject) => {
          request.addEventListener("success", () => resolve(request.result), {
            once: true,
          });
          request.addEventListener("error", () => reject(request.error), {
            once: true,
          });
        });
      }

      async function inspectDurableRecords() {
        const database = await requestResult(indexedDB.open(DATABASE_NAME));
        const transaction = database.transaction(
          ["key-material", "credentials"],
          "readonly",
        );
        const keyRequest = transaction
          .objectStore("key-material")
          .get("gemini-aes-gcm-key");
        const credentialRequest = transaction
          .objectStore("credentials")
          .get("gemini-api-key");
        const [keyRecord, credentialRecord] = await Promise.all([
          requestResult(keyRequest),
          requestResult(credentialRequest),
        ]);
        database.close();
        return { keyRecord, credentialRecord };
      }

      async function deleteTestDatabase() {
        await requestResult(indexedDB.deleteDatabase(DATABASE_NAME));
      }

      async function run() {
        const repository = createGeminiCredentialRepository({
          databaseName: DATABASE_NAME,
        });

        try {
          if (sessionStorage.getItem(PHASE_KEY) !== "read") {
            await repository.clear();
            const capability = await repository.probePersistence();
            const initial = await repository.load();
            if (!capability.supported || initial.status !== "empty") {
              throw new Error("Credential capability or clean-state check failed.");
            }
            await repository.save(SYNTHETIC_CREDENTIAL);
            sessionStorage.setItem(PHASE_KEY, "read");
            location.reload();
            return;
          }

          const loaded = await repository.load();
          const { keyRecord, credentialRecord } = await inspectDurableRecords();
          const durableSnapshot = JSON.stringify(credentialRecord);
          const localStorageSnapshot = JSON.stringify({ ...localStorage });
          await repository.clear();
          const afterClear = await repository.load();

          const details = {
            afterClearStatus: afterClear.status,
            ciphertextStored:
              credentialRecord?.ciphertext instanceof ArrayBuffer &&
              credentialRecord.ciphertext.byteLength > 0,
            durableContainsPlaintext: durableSnapshot.includes(
              SYNTHETIC_CREDENTIAL,
            ),
            keyAlgorithm: keyRecord?.key?.algorithm?.name ?? null,
            keyExtractable: keyRecord?.key?.extractable ?? null,
            loadedCredentialMatches:
              loaded.status === "ready" &&
              loaded.credential === SYNTHETIC_CREDENTIAL,
            localStorageContainsPlaintext: localStorageSnapshot.includes(
              SYNTHETIC_CREDENTIAL,
            ),
          };
          const passed =
            details.afterClearStatus === "empty" &&
            details.ciphertextStored &&
            !details.durableContainsPlaintext &&
            details.keyAlgorithm === "AES-GCM" &&
            details.keyExtractable === false &&
            details.loadedCredentialMatches &&
            !details.localStorageContainsPlaintext;

          document.body.dataset.status = passed ? "passed" : "failed";
          result.textContent = JSON.stringify(details, null, 2);
          await deleteTestDatabase();
        } catch (error) {
          document.body.dataset.status = "failed";
          result.textContent = JSON.stringify(
            {
              errorName: error instanceof Error ? error.name : "UnknownError",
              message: error instanceof Error ? error.message : String(error),
            },
            null,
            2,
          );
        }
      }

      void run();
    </script>
  </body>
</html>
