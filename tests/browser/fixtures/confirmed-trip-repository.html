<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Confirmed trip repository test</title>
  </head>
  <body data-status="running">
    <pre id="result"></pre>
    <script type="module">
      import { goldenOsakaCanonicalTrip } from "/src/fixtures/golden/osakaCanonicalTrip.ts";
      import { createConfirmedTripRepository } from "/src/persistence/confirmedTripRepository.ts";

      const databaseName = `confirmed-trip-browser-test-${crypto.randomUUID()}`;
      const result = document.querySelector("#result");

      function requestResult(request) {
        return new Promise((resolve, reject) => {
          request.addEventListener("success", () => resolve(request.result), {
            once: true,
          });
          request.addEventListener("error", () => reject(request.error), {
            once: true,
          });
        });
      }

      async function countStoredTrips() {
        const database = await requestResult(indexedDB.open(databaseName));
        const request = database
          .transaction("trips", "readonly")
          .objectStore("trips")
          .count();
        const count = await requestResult(request);
        database.close();
        return count;
      }

      async function overwriteStoredTrip(tripId, trip) {
        const database = await requestResult(indexedDB.open(databaseName));
        const read = database.transaction("trips", "readonly");
        const record = await requestResult(
          read.objectStore("trips").get(tripId),
        );
        const write = database.transaction("trips", "readwrite");
        write.objectStore("trips").put({ ...record, trip });
        await new Promise((resolve, reject) => {
          write.addEventListener("complete", resolve, { once: true });
          write.addEventListener("abort", reject, { once: true });
        });
        database.close();
      }

      async function deleteTestDatabase() {
        await requestResult(indexedDB.deleteDatabase(databaseName));
      }

      async function run() {
        try {
          const repository = createConfirmedTripRepository({ databaseName });
          const initial = await repository.loadActive();

          await repository.replaceActive(goldenOsakaCanonicalTrip);
          const first = await repository.loadActive();

          const legacy = structuredClone(goldenOsakaCanonicalTrip);
          legacy.schema_version = "canonical-trip.v1";
          legacy.entities = legacy.entities.map((entity) => ({
            ...entity,
            provenance: {
              origin:
                entity.provenance.origin === "user" ? "user" : "source",
              overridden_fields: entity.provenance.overridden_fields,
            },
          }));
          await overwriteStoredTrip(goldenOsakaCanonicalTrip.id, legacy);
          const migratedLegacy = await repository.loadActive();

          const replacement = structuredClone(goldenOsakaCanonicalTrip);
          replacement.id = "browser-test:replacement";
          replacement.title = "Replacement trip";
          await repository.replaceActive(replacement);
          const second = await repository.loadActive();

          const invalid = structuredClone(replacement);
          invalid.start_date = "2026-02-31";
          invalid.end_date = "2026-02-01";
          invalid.entities[0].time.kind = "exact";
          invalid.entities[0].time.start = null;
          let invalidRejected = false;
          try {
            await repository.replaceActive(invalid);
          } catch {
            invalidRejected = true;
          }
          const afterRejectedReplacement = await repository.loadActive();
          const storedTripCount = await countStoredTrips();

          const details = {
            afterRejectedReplacementId:
              afterRejectedReplacement.status === "ready"
                ? afterRejectedReplacement.trip.id
                : null,
            firstActiveId:
              first.status === "ready" ? first.trip.id : null,
            initialStatus: initial.status,
            invalidRejected,
            legacyReadAsV2:
              migratedLegacy.status === "ready" &&
              migratedLegacy.trip.schema_version === "canonical-trip.v2" &&
              migratedLegacy.trip.entities.every(
                (entity) =>
                  entity.provenance.origin === "legacy_unavailable" &&
                  entity.provenance.source_id === null &&
                  entity.provenance.locator_refs.length === 0,
              ),
            secondActiveId:
              second.status === "ready" ? second.trip.id : null,
            storedTripCount,
          };
          const passed =
            details.initialStatus === "empty" &&
            details.firstActiveId === goldenOsakaCanonicalTrip.id &&
            details.secondActiveId === replacement.id &&
            details.invalidRejected &&
            details.legacyReadAsV2 &&
            details.afterRejectedReplacementId === replacement.id &&
            details.storedTripCount === 1;

          document.body.dataset.status = passed ? "passed" : "failed";
          result.textContent = JSON.stringify(details, null, 2);
          await deleteTestDatabase();
        } catch (error) {
          document.body.dataset.status = "failed";
          result.textContent = JSON.stringify(
            {
              errorName: error instanceof Error ? error.name : "UnknownError",
              message: error instanceof Error ? error.message : String(error),
            },
            null,
            2,
          );
        }
      }

      void run();
    </script>
  </body>
</html>
