<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Credential key compatibility spike</title>
    <style>
      body {
        max-width: 48rem;
        margin: 2rem auto;
        padding: 0 1rem;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      pre {
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>Credential key compatibility spike</h1>
    <p id="status" data-status="running">Running…</p>
    <pre id="result"></pre>
    <script type="module">
      const DATABASE_NAME = "trip-runtime-credential-key-spike-v1";
      const STORE_NAME = "roundtrip";
      const RECORD_ID = "non-extractable-aes-gcm";
      const SESSION_PHASE = "trip-runtime-credential-key-spike-phase";
      const SENTINEL = "credential-sentinel-v1";

      const status = document.querySelector("#status");
      const result = document.querySelector("#result");

      function requestResult(request) {
        return new Promise((resolve, reject) => {
          request.addEventListener("success", () => resolve(request.result), {
            once: true,
          });
          request.addEventListener("error", () => reject(request.error), {
            once: true,
          });
        });
      }

      function transactionComplete(transaction) {
        return new Promise((resolve, reject) => {
          transaction.addEventListener("complete", resolve, { once: true });
          transaction.addEventListener(
            "abort",
            () => reject(transaction.error),
            { once: true },
          );
          transaction.addEventListener(
            "error",
            () => reject(transaction.error),
            { once: true },
          );
        });
      }

      async function openDatabase() {
        const request = indexedDB.open(DATABASE_NAME, 1);
        request.addEventListener("upgradeneeded", () => {
          request.result.createObjectStore(STORE_NAME, { keyPath: "id" });
        });
        return requestResult(request);
      }

      async function writeRecord() {
        const key = await crypto.subtle.generateKey(
          { name: "AES-GCM", length: 256 },
          false,
          ["encrypt", "decrypt"],
        );
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const ciphertext = await crypto.subtle.encrypt(
          { name: "AES-GCM", iv },
          key,
          new TextEncoder().encode(SENTINEL),
        );
        const database = await openDatabase();
        const transaction = database.transaction(STORE_NAME, "readwrite");
        transaction.objectStore(STORE_NAME).put({
          id: RECORD_ID,
          key,
          iv,
          ciphertext,
        });
        await transactionComplete(transaction);
        database.close();
      }

      async function readRecord() {
        const database = await openDatabase();
        const transaction = database.transaction(STORE_NAME, "readonly");
        const record = await requestResult(
          transaction.objectStore(STORE_NAME).get(RECORD_ID),
        );
        await transactionComplete(transaction);
        database.close();

        if (!record) {
          throw new Error("IndexedDB record was absent after reload.");
        }

        const plaintext = new TextDecoder().decode(
          await crypto.subtle.decrypt(
            { name: "AES-GCM", iv: record.iv },
            record.key,
            record.ciphertext,
          ),
        );

        let exportBlocked = false;
        try {
          await crypto.subtle.exportKey("raw", record.key);
        } catch (error) {
          exportBlocked =
            error instanceof DOMException && error.name === "InvalidAccessError";
        }

        const localStorageSnapshot = JSON.stringify({ ...localStorage });
        return {
          algorithm: record.key.algorithm.name,
          ciphertextByteLength: record.ciphertext.byteLength,
          decryptedSentinelMatches: plaintext === SENTINEL,
          exportBlocked,
          extractable: record.key.extractable,
          keyType: record.key.type,
          localStorageContainsPlaintext: localStorageSnapshot.includes(SENTINEL),
          localStorageEntryCount: localStorage.length,
          secureContext: window.isSecureContext,
          userAgent: navigator.userAgent,
          usages: [...record.key.usages],
        };
      }

      async function run() {
        try {
          if (sessionStorage.getItem(SESSION_PHASE) !== "read") {
            await writeRecord();
            sessionStorage.setItem(SESSION_PHASE, "read");
            location.reload();
            return;
          }

          const details = await readRecord();
          const passed =
            details.secureContext &&
            details.algorithm === "AES-GCM" &&
            details.keyType === "secret" &&
            details.extractable === false &&
            details.usages.includes("encrypt") &&
            details.usages.includes("decrypt") &&
            details.decryptedSentinelMatches &&
            details.exportBlocked &&
            !details.localStorageContainsPlaintext;

          status.dataset.status = passed ? "passed" : "failed";
          status.textContent = passed ? "PASS" : "FAIL";
          result.textContent = JSON.stringify(details, null, 2);
          sessionStorage.setItem(SESSION_PHASE, "complete");
        } catch (error) {
          status.dataset.status = "failed";
          status.textContent = "FAIL";
          result.textContent = JSON.stringify(
            {
              errorName: error instanceof Error ? error.name : "UnknownError",
              message:
                error instanceof Error ? error.message : "Unknown compatibility error",
              userAgent: navigator.userAgent,
            },
            null,
            2,
          );
        }
      }

      void run();
    </script>
  </body>
</html>
